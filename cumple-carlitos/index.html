<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Happy Birthday Carlitos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{min-height:100svh}.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;padding:24px}.title{font-size:clamp(30px,9vw,62px);font-weight:800;margin-bottom:8vh}.time{font-size:clamp(58px,19vw,130px);font-weight:900;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.labels{display:flex;gap:10vw;color:#aaa;font-size:clamp(12px,3.5vw,20px);text-transform:uppercase}.date{margin-top:7vh;font-size:clamp(16px,4.5vw,26px);color:#ccc}.party{display:none;z-index:5}.party h1{font-size:clamp(46px,14vw,110px);line-height:.95;margin:0;z-index:10;text-shadow:0 0 25px #fff}.party h2{font-size:clamp(24px,7vw,48px);z-index:10}.spark{position:absolute;width:9px;height:9px;border-radius:50%;animation:boom 1.8s ease-out forwards}.conf{position:absolute;width:9px;height:18px;animation:fall 4s linear infinite}@keyframes boom{to{transform:translate(var(--x),var(--y));opacity:0}}@keyframes fall{from{transform:translateY(-15vh) rotate(0)}to{transform:translateY(120vh) rotate(720deg)}}
</style>
</head><body>
<div class="screen" id="count"><div class="title">Happy Birthday Carlitos 🎂</div><div class="time" id="time">00:00:00</div><div class="labels"><span>Horas</span><span>Min</span><span>Seg</span></div><div class="date">31 de agosto de 2026 · 12:00 AM</div></div>
<div class="screen party" id="party"><h1>🎆 HAPPY BIRTHDAY<br>CARLITOS! 🎂</h1><h2>¡Te queremos mucho! ❤️</h2></div>
<script>
const target=new Date('2026-08-31T00:00:00-07:00'),time=document.getElementById('time'),count=document.getElementById('count'),party=document.getElementById('party');let started=false;
function celebrate(){if(started)return;started=true;count.style.display='none';party.style.display='flex';const colors=['#ff1744','#ffd600','#00e5ff','#76ff03','#e040fb','#fff'];for(let n=0;n<14;n++)setTimeout(()=>{const ox=10+Math.random()*80,oy=8+Math.random()*55;for(let i=0;i<45;i++){const e=document.createElement('i'),a=Math.random()*Math.PI*2,r=70+Math.random()*240;e.className='spark';e.style.left=ox+'%';e.style.top=oy+'%';e.style.background=colors[i%colors.length];e.style.setProperty('--x',Math.cos(a)*r+'px');e.style.setProperty('--y',Math.sin(a)*r+'px');party.appendChild(e);setTimeout(()=>e.remove(),1900)}},n*260);for(let i=0;i<90;i++){const e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'%';e.style.top=(-20-Math.random()*100)+'px';e.style.background=colors[i%colors.length];e.style.animationDelay=Math.random()*3+'s';e.style.animationDuration=(2.5+Math.random()*3)+'s';party.appendChild(e)}}
function tick(){const d=target-Date.now();if(d<=0){time.textContent='00:00:00';celebrate();return}const s=Math.floor(d/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;time.textContent=[h,m,sec].map(v=>String(v).padStart(2,'0')).join(':')}
tick();setInterval(tick,250);
</script></body></html>
